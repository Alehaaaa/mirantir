name: Validate Kodi repository

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit-test catalogue source discovery
        run: python -m unittest discover -s tests -v
      - name: Rebuild repository
        run: python tools/build_repo.py
      - name: Validate add-on integration
        run: python tools/check_addon.py
      - name: Validate packages and metadata
        run: python tools/check_repo.py
