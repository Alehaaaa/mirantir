name: Cloudflare Stremio addon

on:
  push:
    branches: [main]
    paths: ["stremio/**", ".github/workflows/stremio-cloudflare.yml"]
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mirantir-stremio-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stremio
    env:
      CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      CF_D1_DATABASE_ID: "${{ secrets.CF_D1_DATABASE_ID }}"
      STREMIO_CONFIG_KEY: "${{ secrets.STREMIO_CONFIG_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CF_D1_DATABASE_ID" && test -n "$STREMIO_CONFIG_KEY" || { echo "Set Cloudflare secrets; see stremio/README.md"; exit 1; }
          test "${#STREMIO_CONFIG_KEY}" -ge 32
      - name: Install, test and deploy
        run: npm ci --no-audit --no-fund && npm test && npm run deploy
      - name: Configure encryption secret
        run: printf '%s' "$STREMIO_CONFIG_KEY" | npx wrangler secret put CONFIG_KEY --config wrangler.generated.jsonc

  sync:
    needs: [deploy]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stremio
    env:
      CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      CF_D1_DATABASE_ID: "${{ secrets.CF_D1_DATABASE_ID }}"
      GITHUB_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check D1 credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CF_D1_DATABASE_ID"
      - name: Install Wrangler
        run: npm ci --no-audit --no-fund
      - name: Sync upstream and export D1 generation
        run: python scripts/export_catalogue.py --output .data/import
      - name: Stage SQL and activate only when complete
        run: node scripts/import_d1.mjs
